name: Schermate SirJoe Training

# Installa l'app in un emulatore Android, avvia un'uscita di prova (dati finti) e fotografa
# la pagina In bici su due schermi: grande (come Huawei/Redmi recenti) e piccolo (Redmi 4X).
# Le foto vanno nel ramo "schermate".
on:
  workflow_run:
    workflows: [ 'Compila SirJoe Training' ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  screens:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Scarica l'APK appena compilato
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
          merge-multiple: true

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e foto
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/schermate.sh apk shots

      - name: Pubblica le foto nel ramo "schermate"
        if: always()
        run: |
          ls -la shots || exit 0
          cd shots
          git init -q
          git checkout -q -b schermate
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Schermate ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" schermate
