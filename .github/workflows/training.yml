name: Compila SirJoe Training

on:
  push:
    branches: [ main ]
    paths: [ 'training/**', '.github/workflows/training.yml', 'settings.gradle.kts', 'build.gradle.kts' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test (zone, allenatore, formato uscite)
        run: |
          set -o pipefail
          gradle :training:testDebugUnitTest --console=plain 2>&1 | tee build-log.txt

      - name: Controllo compatibilità Android 6+
        run: |
          set -o pipefail
          gradle :training:lintDebug --console=plain 2>&1 | tee -a build-log.txt

      - name: Compila APK
        run: |
          set -o pipefail
          gradle :training:assembleDebug --console=plain 2>&1 | tee -a build-log.txt

      - name: Riassunto errori
        if: failure()
        run: |
          touch build-log.txt
          grep -E "^e: |^w: .*(NewApi|InlinedApi)|Error:|FAILED|Exception|expected:<|AssertionError" build-log.txt | grep -v "^w: .*deprecat" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          for f in training/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o '<failure message="[^"]*"' "$f" | head -10 | while IFS= read -r l; do echo "::error::test $(basename $f): $l"; done
          done
          for f in training/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E "Error|error" "$f" | head -30 | while IFS= read -r l; do echo "::error::lint: $l"; done
          done
          true

      - name: Leggi la versione
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' training/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versione: $VERSION"

      - name: Rinomina APK con la versione
        run: cp training/build/outputs/apk/debug/training-debug.apk "SirJoeTraining-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SirJoeTraining-v${{ env.VERSION }}
          path: SirJoeTraining-v${{ env.VERSION }}.apk

      - name: Controlla se la versione è già pubblicata
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/training-v${VERSION}" >/dev/null; then
            echo "NEW_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "NEW_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Pubblica la nuova versione in Releases
        if: github.ref == 'refs/heads/main' && env.NEW_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: training-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SirJoe Training ${{ env.VERSION }}
          make_latest: false
          body: |
            App Android per allenarsi con fascia cardio e sensore di cadenza (ANT+ o Bluetooth).
            Si installa **accanto** a SirJoe MTB, non la sostituisce.

            APK da installare: **SirJoeTraining-v${{ env.VERSION }}.apk** (qui sotto, in Assets).
            Le versioni successive si installano sopra: programmi, uscite e impostazioni restano.

            Per la fascia Garmin ANT+ installa anche dal Play Store le app gratuite di Garmin
            «ANT+ Plugins Service» e «ANT Radio Service».
          files: SirJoeTraining-v${{ env.VERSION }}.apk
