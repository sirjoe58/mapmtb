name: Compila APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**', '.github/workflows/desktop.yml', 'training/**', '.github/workflows/training.yml' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test (formato FIT e funzioni)
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --console=plain 2>&1 | tee build-log.txt

      - name: Verifica FIT con fitparse
        run: |
          pip install fitparse
          python tools/check_fit.py

      - name: Versioni librerie mappe
        run: gradle :app:dependencies --configuration debugRuntimeClasspath | grep -i -E "mapsforge|androidsvg" | sort -u | head -20

      - name: Controllo compatibilità Android 6+
        run: |
          set -o pipefail
          gradle :app:lintDebug --console=plain 2>&1 | tee -a build-log.txt

      - name: Compila APK di debug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee -a build-log.txt

      - name: Riassunto errori
        if: failure()
        run: |
          touch build-log.txt
          grep -E "^e: |^w: .*(NewApi|InlinedApi)|Error:|FAILED|Exception|expected:<|AssertionError" build-log.txt | grep -v "^w: .*deprecat" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o '<failure message="[^"]*"' "$f" | head -10 | while IFS= read -r l; do echo "::error::test $(basename $f): $l"; done
          done
          for f in app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E "Error|error" "$f" | head -30 | while IFS= read -r l; do echo "::error::lint: $l"; done
          done
          true

      - name: Leggi la versione
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versione: $VERSION"

      - name: Rinomina APK con la versione
        run: cp app/build/outputs/apk/debug/app-debug.apk "SirJoeMTB-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SirJoeMTB-v${{ env.VERSION }}
          path: SirJoeMTB-v${{ env.VERSION }}.apk

      - name: Controlla se la versione è già pubblicata
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "NEW_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "NEW_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Pubblica la nuova versione in Releases
        if: github.ref == 'refs/heads/main' && env.NEW_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SirJoe MTB ${{ env.VERSION }}
          body: |
            APK da installare: **SirJoeMTB-v${{ env.VERSION }}.apk** (qui sotto, in Assets).
            Si installa sopra la versione precedente: tracce, mappe e impostazioni restano.
          files: SirJoeMTB-v${{ env.VERSION }}.apk
